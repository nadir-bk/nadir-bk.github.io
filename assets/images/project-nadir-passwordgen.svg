<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bgLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b2b2d"/>
      <stop offset="100%" stop-color="#19191a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bgLock)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="400" y1="0" x2="400" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- padlock -->
  <g>
    <path d="M350 210 v-34 a50 50 0 0 1 100 0 v34" fill="none" stroke="#ffdb70" stroke-width="14" stroke-linecap="round"/>
    <rect x="326" y="206" width="148" height="120" rx="16" fill="#333335"/>
    <circle cx="400" cy="256" r="14" fill="#ffdb70"/>
    <rect x="393" y="256" width="14" height="34" rx="6" fill="#ffdb70"/>
  </g>

  <!-- generated password dots -->
  <g transform="translate(0,362)">
    <rect x="300" y="0" width="200" height="34" rx="17" fill="#2a2a2c"/>
    <circle cx="322" cy="17" r="6" fill="#ffdb70"/>
    <circle cx="344" cy="17" r="6" fill="#ffdb70"/>
    <circle cx="366" cy="17" r="6" fill="#ffdb70"/>
    <circle cx="388" cy="17" r="6" fill="#ffdb70" opacity="0.7"/>
    <circle cx="410" cy="17" r="6" fill="#ffdb70" opacity="0.7"/>
    <circle cx="432" cy="17" r="6" fill="#ffdb70" opacity="0.4"/>
    <circle cx="454" cy="17" r="6" fill="#ffdb70" opacity="0.4"/>
    <circle cx="476" cy="17" r="6" fill="#ffdb70" opacity="0.25"/>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="Poppins, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" opacity="0.55" letter-spacing="1">PYTHON SCRIPT</text>
</svg>
